# Hibernate must not manage this schema. The schema is maintained by the numbered SQL
# files in doc/, so `update` has nothing useful to contribute and one specific way to do
# damage: Trip.status is mapped as a Java String, so on every start Hibernate issued
#   alter table trip modify column status varchar(255) not null
# which silently replaced the ENUM installed by 01_cleanup_and_simulation_schema.sql and
# stopped the database rejecting invalid statuses. Measured as varchar(255) on the live
# database before this change. See doc/03_restore_trip_status_enum.sql.
#
# This also silences two ALTERs that failed on every start, blocked by the fk_trip_vehicle
# foreign key (trip.registration_number and vehicle.registration_number).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
logging.level.org.springframework.security=DEBUG
spring.devtools.restart.enabled=false


