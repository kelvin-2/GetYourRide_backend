# Manual tracking-message publisher (Phase 3), for verifying the STOMP transport before the
# Phase 4 simulator exists. Left commented out on purpose: while enabled, any authenticated
# caller can broadcast a fabricated vehicle position to a trip's subscribers. Enable locally
# only, and turn it off again afterwards.
#   POST /api/trips/{tripId}/tracking/test-location?lat=-33.96&lng=25.61&legIndex=1
#   POST /api/trips/{tripId}/tracking/test-stop-event?stopId=7&status=ARRIVED
#getyourride.tracking.test-publisher.enabled=true

# --- Trip simulation engine (Phase 4) ----------------------------------------
# There is no real driver GPS feed, so vehicle movement is simulated by walking each
# trip along the leg polylines precomputed into trip_leg_route.
#
# Master switch, OFF unless explicitly set to true. Off by default because each tick
# writes to the database: it mutates trip.current_* and appends trip_location_history
# rows for every IN_PROGRESS trip. Anything that starts an application context would
# inherit that, including the @SpringBootTest suite, which runs against this same
# database. Turn it on deliberately when you want trips to move.
getyourride.tracking.simulation.enabled=false
#
# The remaining values are shown at their defaults; uncomment only to change one.
#
# How often a tick runs, in milliseconds. Read at annotation level, so a change needs a
# restart. 4000 matches tracking documentation section 4.3.
#getyourride.tracking.simulation.tick-interval-ms=4000
#
# Real-time compression. At 10.0 a leg that ORS says takes 5 minutes is traversed in 30
# seconds of wall clock. Without this, watching a trip would take as long as driving it.
# Raise it to speed up a demo; 1.0 is real time.
#getyourride.tracking.simulation.speed-multiplier=10.0
#
# Simulated boarding pause at each stop, in seconds, before the next leg begins.
#getyourride.tracking.simulation.dwell-seconds=20
#
# Points advanced per tick when a leg has no usable ORS duration to derive a step from.
#getyourride.tracking.simulation.fallback-step-size=5